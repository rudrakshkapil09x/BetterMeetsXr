<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BetterGoogleMeets Side Panel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #frame-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      flex: 1;
    }
    #fallback {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 24px;
      text-align: center;
      background: #090d16;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(6, 182, 212, 0.15);
      color: #06b6d4;
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h2 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #f1f5f9;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .code-box {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px 14px;
      font-family: monospace;
      font-size: 12px;
      color: #38bdf8;
      margin-bottom: 16px;
      width: 100%;
      word-break: break-all;
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div id="frame-container">
    <iframe id="meets-app-frame" src="about:blank"></iframe>
  </div>

  <div id="fallback">
    <div class="badge">BetterGoogleMeets</div>
    <h2>Connecting to Local UI...</h2>
    <p>Ensure your BetterMeets frontend dev server is running on port 5173:</p>
    <div class="code-box">cd better-google-meets/frontend && npm run dev</div>
    <button id="retry-btn">Retry Connection</button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
